<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ToppperTube – YouTube for learning</title>
<style>
:root{--bg:#fdfdfb;--fg:#0f0f0f;--mut:#606060;--card:#f1f1ee;--hov:#e8e8e4;--line:#dcdcd6;--acc:#d62839}
[data-theme=dark]{--bg:#0f1115;--fg:#f1f1f1;--mut:#a8abb3;--card:#1a1d24;--hov:#272b34;--line:#2c313b;--acc:#ff5a6a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 Roboto,"Segoe UI",system-ui,sans-serif}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid #2f6fed;outline-offset:2px}
header{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;padding:10px 16px;height:62px}
.ib{width:42px;height:42px;border-radius:50%;border:0;background:var(--card);display:grid;place-items:center;flex:none}
.ib:hover{background:var(--hov)}
.logo{font-weight:800;font-size:22px;letter-spacing:-.5px}.logo b{color:var(--acc)}
.sf{flex:1;max-width:640px;margin:0 auto;display:flex;min-width:0}
.sf input{flex:1;min-width:0;padding:10px 18px;border:1px solid var(--line);border-right:0;border-radius:24px 0 0 24px;background:var(--bg)}
.sf button{padding:0 20px;border:1px solid var(--line);background:var(--card);border-radius:0 24px 24px 0}
.shell{display:flex}
nav{width:240px;flex:none;padding:8px 12px;position:sticky;top:62px;height:calc(100vh - 62px);overflow:auto}
nav a{display:flex;gap:20px;align-items:center;padding:9px 14px;border-radius:10px;font-weight:500}
nav a:hover{background:var(--hov)}nav a[aria-current=page]{background:var(--card);font-weight:700}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:middle}
main{flex:1;min-width:0;padding:8px 20px 60px}
body.nonav nav{display:none}
@media(max-width:900px){nav{position:fixed;z-index:30;left:0;background:var(--bg);box-shadow:2px 0 14px rgba(0,0,0,.25);display:none}body.navopen nav{display:block}main{padding:8px 12px 60px}.logo{font-size:18px}}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:6px 0 12px}
h2{margin:0;font-size:22px}h3{margin:18px 0 8px;font-size:16px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.mut{color:var(--mut)}.err{color:var(--acc);font-weight:600}
.btn{border:0;background:var(--card);padding:8px 16px;border-radius:20px;font-weight:600;display:inline-flex;gap:8px;align-items:center}
.btn:hover{background:var(--hov)}.btn.on{background:var(--fg);color:var(--bg)}.btn.pri{background:var(--acc);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px}
.chip{border:0;background:var(--card);padding:7px 14px;border-radius:9px;white-space:nowrap;font-weight:500}
.chip[aria-pressed=true]{background:var(--fg);color:var(--bg)}
.fpanel{display:flex;gap:16px;flex-wrap:wrap;margin:8px 0 14px;padding:12px;background:var(--card);border-radius:12px}
.fpanel label{display:grid;gap:4px;font-size:13px;color:var(--mut)}
select,input[type=text]{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:24px 18px}
.cw{position:relative}
.th{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:var(--card)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.dur{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.82);color:#fff;font-size:12px;font-weight:600;padding:1px 6px;border-radius:5px}
.ct{font-weight:600;line-height:1.3;margin-top:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cm{color:var(--mut);font-size:13.5px}
.cs{padding:8px 14px;border:1px solid var(--line);border-radius:20px;background:var(--bg);min-width:200px}
.cl:hover{text-decoration:underline}
.cb{position:absolute;top:8px;right:8px;border:0;border-radius:8px;padding:5px 10px;background:rgba(0,0,0,.8);color:#fff;font-size:13px;font-weight:600;opacity:0}
.cw:hover .cb,.cb:focus-visible{opacity:1}@media(hover:none){.cb{opacity:1}}
.cw.sm a{display:flex;gap:10px}.cw.sm .th{width:160px;flex:none;border-radius:10px}.cw.sm .ct{margin-top:0;font-size:14px}.cw.sm{margin-bottom:12px}
.cw.cur{background:var(--card);border-radius:10px;padding:4px}
.more{display:block;margin:24px auto}
.watch{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;padding-top:8px}
@media(max-width:1100px){.watch{grid-template-columns:1fr}}
.frame{aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden}
.frame iframe{width:100%;height:100%;border:0;display:block}
h1.vt{font-size:20px;margin:14px 0 4px;line-height:1.3}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.notes{border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}
.notes .hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.nt{width:100%;min-height:200px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.tile{display:block;background:var(--card);border-radius:14px;padding:16px}.tile:hover{background:var(--hov)}
.tile b{display:block;font-size:17px;margin-bottom:4px}
.nrow{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.nrow p{margin:4px 0}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--bg);color:var(--fg);padding:20px;width:min(400px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.opt{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
@media print{header,nav,.acts,.notes .hd{display:none}}
</style>
</head>
<body>
<header>
  <button class="ib" id="menuBtn" type="button" aria-label="Menu"></button>
  <a class="logo" href="#/home">Topper<b>Tube</b></a>
  <form class="sf" id="sf" role="search"><input id="q" type="search" placeholder="Search" aria-label="Search lessons"><button type="submit" aria-label="Search" id="sb"></button></form>
  <button class="ib" id="themeBtn" type="button" aria-label="Toggle dark mode"></button>
</header>
<div class="shell"><nav id="nav" aria-label="Main"></nav><main id="main" tabindex="-1"></main></div>
<dialog id="dlg"></dialog>
<script src="app.js"></script>
</body>
</html>
